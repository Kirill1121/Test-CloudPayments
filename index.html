<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фонд «Три Кота»</title>
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f4ed;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #ff8c42;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="cats.jpg">
        <h2 style="text-align:center;">Пожертвование в фонд «Три Кота»</h2>
        <form id="donationForm">
            <input type="text" id="lastName" placeholder="Фамилия" required>
            <input type="text" id="firstName" placeholder="Имя" required>
            <input type="text" id="middleName" placeholder="Отчество">
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Телефон (формат 89999999999)" required>
            <input type="number" id="amount" value="444" min="100" placeholder="Сумма (₽)" required>
            <textarea id="comment" rows="3" placeholder="Комментарий (необязательно)"></textarea>
            <label>
                <input type="checkbox" id="monthlyCheck" style="margin: -280px;" checked > Сделать ежемесячным
            </label>
            <button type="button" onclick="startPayment()">Сделать пожертвование</button>
        </form>
    </div>

    <script>
        function startPayment() {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount < 100) {
                alert("Введите сумму не менее 100 ₽");
                return;
            }
            
            const isMonthly = document.getElementById('monthlyCheck').checked;
            const description = isMonthly 
                ? `Ежемесячное пожертвование — ${amount} ₽` 
                : `Единоразовое пожертвование — ${amount} ₽`;
            
            const widget = new cp.CloudPayments();
            
            const options = {
                publicId: 'pk_774378acb9906498bfe828d52a0c9',
                description: description,
                amount: amount,
                currency: 'RUB',
                invoiceId: 'TRIKOTA-123',
                email: document.getElementById('email').value,
                skin: "classic",
                data: {
                    lastName: document.getElementById('lastName').value,
                    firstName: document.getElementById('firstName').value,
                    middleName: document.getElementById('middleName').value,
                    phone: document.getElementById('phone').value,
                    comment: document.getElementById('comment').value,
                    fund: 'tri-kota'
                }
            };
            
            var receipt = {
            Items: [//товарные позиции
                 {
                    label: 'Пожертвование', //наименование товара
                    price:  document.getElementById('amount').value, //цена
                    quantity: 1, //количество
                    amount: document.getElementById('amount').value, //сумма
                    vat: 20, //ставка НДС
                    method: 0, // тег-1214 признак способа расчета - признак способа расчета
                    object: 0, // тег-1212 признак предмета расчета - признак предмета товара, работы, услуги, платежа, выплаты, иного предмета расчета
                }
            ],
            taxationSystem: 0, //система налогообложения; необязательный, если у вас одна система налогообложения
            email: document.getElementById('email').value, //e-mail покупателя, если нужно отправить письмо с чеком
            phone: document.getElementById('phone').value, //телефон покупателя в любом формате, если нужно отправить сообщение со ссылкой на чек
            isBso: false, //чек является бланком строгой отчетности
            amounts:
            {
                electronic: document.getElementById('amount').value, // Сумма оплаты электронными деньгами
                advancePayment: 0.00, // Сумма из предоплаты (зачетом аванса) (2 знака после запятой)
                credit: 0.00, // Сумма постоплатой(в кредит) (2 знака после запятой)
                provision: 0.00 // Сумма оплаты встречным предоставлением (сертификаты, др. мат.ценности) (2 знака после запятой)
            }
        };

            if (isMonthly) {
                options.accountId = document.getElementById('email').value;
                options.data.cloudPayments = {
                    CustomerReceipt: receipt,
                    recurrent: { interval: 'Month', period: 1, customerReceipt: receipt}
                };
            }
            else {
                options.data.cloudPayments = {
                    CustomerReceipt: receipt,
                };
            }
            
            widget.pay('charge', options, {
                onSuccess: function () {
                alert("Спасибо! Пожертвование прошло успешно ❤️");
                },
                onFail: function () {
                alert("Виджет с оплатой был закрыт. Пожалуйста, повторите попытку ещё раз.");
                }
});
        }
    </script>
</body>
</html>
